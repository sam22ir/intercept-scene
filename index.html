<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intercept — 3D Scene</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="panel top-left">
      <div class="title">Intercept</div>
      <div class="focus-buttons" role="group" aria-label="Camera focus">
        <button data-focus="free" class="active">Free</button>
        <button data-focus="plane">Plane</button>
        <button data-focus="missile">Missile</button>
        <button data-focus="ship">Ship</button>
        <span class="sep" aria-hidden="true"></span>
        <button id="btn-labels" class="toggle active" aria-pressed="true" title="Show tags and missile path (L)">Labels</button>
      </div>
      <div class="hint">Click an object to focus · drag to orbit · scroll to zoom · Esc for free camera · L toggles labels</div>
      <a id="dl-offline" class="dl-link" href="/intercept-offline" download="intercept-offline.html" title="One HTML file that runs without internet: double-click to open">⬇ Download offline version</a>
    </div>

    <div class="panel top-right telemetry">
      <div><span>Plane alt</span><b id="tm-alt">—</b></div>
      <div><span>Plane speed</span><b id="tm-speed">—</b></div>
      <div><span>Missile speed</span><b id="tm-mspeed">—</b></div>
      <div><span>Missile range</span><b id="tm-range">—</b></div>
    </div>

    <div class="panel timeline">
      <div class="controls">
        <button id="btn-start" title="Back to start (Home)">⏮</button>
        <button id="btn-step-back" title="Step back (←, Shift = 1 s)">◀︎|</button>
        <button id="btn-reverse" title="Play backwards (R)">◀︎◀︎</button>
        <button id="btn-play" title="Play / pause (Space)">▶︎</button>
        <button id="btn-step-fwd" title="Step forward (→, Shift = 1 s)">|▶︎</button>
        <button id="btn-end" title="Jump to end (End)">⏭</button>
        <select id="speed" title="Playback speed">
          <option value="0.1">0.1×</option>
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
        <div class="time"><b id="time-now">0.00</b> / <span id="time-end">0</span> s</div>
      </div>
      <div class="track">
        <div class="markers" id="markers"></div>
        <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="Timeline" />
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
